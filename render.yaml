services:
  - type: web
    name: erihans-academy
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erihans-db
          property: connectionString

databases:
  - name: erihans-db
    plan: free
